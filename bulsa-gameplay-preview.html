<div id="bulsa-preview" style="font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;padding:12px;color:light-dark(#18222d,#edf2f7)">
  <style>
    #bulsa-preview *{box-sizing:border-box} #bulsa-preview .phone{width:330px;overflow:hidden;border:8px solid #2f2f32;border-radius:30px;background:#f8f8f8;box-shadow:0 12px 32px #2f2f3240} #bulsa-preview .bar{display:flex;justify-content:space-between;padding:17px 18px 9px;font-size:12px;font-weight:700}.bulsa-scene{margin:8px 14px 0;padding:16px;border-radius:16px;background:#c59d62;color:#2f2f32}.bulsa-scene .day{font-size:12px;opacity:.85}.bulsa-scene h2{margin:7px 0 3px;font-size:22px}.bulsa-scene p{margin:0;font-size:13px;opacity:.9}.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 14px}.money div{padding:10px 12px;border-radius:16px;background:#fff;border:1px solid #e8e8e8;font-size:11px;color:#2f2f32}.money strong{display:block;margin-top:3px;font-size:16px;color:#2f2f32}.event{margin:0 14px;padding:16px;border-radius:16px;background:#fff;border:1px solid #e8e8e8}.event .tag{font-size:11px;font-weight:800;color:#2f2f32}.event h3{margin:7px 0;font-size:18px}.event p{margin:0 0 13px;font-size:13px;line-height:1.4}.choice{width:100%;margin:5px 0;padding:11px;text-align:left;border:1px solid #e8e8e8;border-radius:12px;background:transparent;color:#2f2f32;font-size:13px;font-weight:650;cursor:pointer}.choice:hover{background:#f8f8f8}.result{min-height:24px;margin:9px 16px;font-size:12px;color:#2f2f32}.nav{display:flex;justify-content:space-around;padding:11px 5px;border-top:1px solid #e8e8e8;font-size:10px;color:#2f2f32}.nav b{color:#c59d62}
  </style>
  <section class="phone" aria-label="BULSA mobile gameplay mockup">
    <div class="bar"><span>9:41</span><span>● ● ●</span></div>
    <div class="bulsa-scene"><div class="day" id="date">TUE, SEPT 22 · 8 DAYS TO PAYDAY</div><h2>BULSA</h2><p>Make today’s choice count.</p></div>
    <div class="money"><div>AVAILABLE CASH<strong id="cash">₱4,280</strong></div><div>SAVINGS GOAL<strong>₱1,700 / ₱3,000</strong></div></div>
    <article class="event"><div class="tag" id="tag">DAILY CHOICE</div><h3 id="title">Lunch break</h3><p id="copy">You forgot to prepare food before work.</p><div id="choices"><button class="choice" data-cost="120">Carinderia — ₱120</button><button class="choice" data-cost="220">Convenience meal — ₱220</button><button class="choice" data-cost="0">Skip / packed snack — ₱0</button></div></article>
    <div class="result" id="result">Choose one option. Every expense is recorded.</div>
    <nav class="nav"><span><b>●</b><br>Today</span><span>◷<br>Calendar</span><span>₱<br>Ledger</span><span>◎<br>Profile</span></nav>
  </section>
  <script>
    (()=>{const root=document.getElementById('bulsa-preview'), cash=root.querySelector('#cash'), result=root.querySelector('#result'), choices=root.querySelector('#choices'), tag=root.querySelector('#tag'), title=root.querySelector('#title'), copy=root.querySelector('#copy'), date=root.querySelector('#date');let value=4280,step=0;const next=()=>{step++;tag.textContent='RANDOM EVENT';title.textContent='Project update';copy.textContent='Your lead says a small app-release incentive may arrive soon. It is not guaranteed.';choices.innerHTML='<button class="choice" data-cost="0">Continue working — possible ₱2,500 incentive</button><button class="choice" data-cost="0">Take a rest day — no incentive chance</button>';date.textContent='WED, SEPT 23 · 7 DAYS TO PAYDAY'};choices.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const cost=Number(button.dataset.cost);value-=cost;cash.textContent='₱'+value.toLocaleString('en-PH');result.textContent=cost?'₱'+cost+' recorded in your ledger. Tomorrow brings a new choice.':'No cash spent. Tomorrow brings a new choice.';[...choices.querySelectorAll('button')].forEach(b=>b.disabled=true);setTimeout(next,450)});})()
  </script>
</div>
